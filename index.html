<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligencia Comercial - Proyección</title>
    <!-- Importando la fuente Rubik -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff; /* Blanco de base */
            font-family: 'Rubik', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Evita barras de scroll */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #carousel-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #ececec; /* Gris claro de fondo por si la imagen no llena todo */
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain; /* Contain evita que se corten los bordes. Si prefieres que llene todo aunque corte, usa 'cover' */
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1s ease-in-out; /* Transición suave de 1 segundo */
        }
        .slide.active {
            opacity: 1;
        }
        /* Tu firma visual estática en la esquina */
        .branding {
            position: absolute;
            bottom: 20px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 100;
        }
        .seal {
            font-size: 28px;
            font-weight: 700;
            color: #29903B; /* Tu verde */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4); /* Sombrita para que se lea sobre cualquier imagen */
        }
        .brand {
            font-size: 16px;
            font-weight: 400;
            color: #0669FE; /* Tu azul */
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="carousel-container">
        <!-- JS inyectará las imágenes aquí -->
    </div>
    
    <!-- El sello de tus proyectos -->
    <div class="branding">
        <div class="seal">Baalam</div>
        <div class="brand">Inteligencia Comercial</div>
    </div>

    <script>
        // ¡REEMPLAZA ESTA LÍNEA CON LA URL DE TU APPS SCRIPT!
        const apiURL = https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTTLlu7hi-hqDnSv9u36hKnyLqnF9VEv12dSG9395yMVQrgYIBOvOfeIzEuOdtVW3vf5LqpHPPeVCZZ2kCo4taamqL_8X9hLAZrOxos1_TAN1OnleYAXzRWcGSN2Z50cOzgJDcnTchziQwe2n8mVj_1qAeEhYvpA4r6LkHHKuzVs41qhLlWlvvaW4T1NsMQhlASYpv8LqilcZza-5J_5834Nb2Hrx4upjCUcEu-0pkN6IBowal3CHz5ukiCALZgk8sn1Ye36wHvQiP2hnINtIL4MUziDw&lib=M5HCwHo076dxgwz3V7gZ9A4FIwK-8SiuQ;
        
        let slidesData = [];
        let currentIndex = 0;
        let container = document.getElementById('carousel-container');

        async function fetchImages() {
            try {
                const response = await fetch(apiURL);
                slidesData = await response.json();
                if(slidesData.length > 0) {
                    renderSlides();
                    startCarousel();
                }
            } catch (error) {
                console.error("Error conectando con Sheets: ", error);
                setTimeout(fetchImages, 15000); // Reintenta en 15 seg si falla
            }
        }

        function renderSlides() {
            container.innerHTML = '';
            slidesData.forEach((slide, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (index === 0 ? ' active' : '');
                div.style.backgroundImage = `url('${slide.url}')`;
                container.appendChild(div);
            });
        }

        function startCarousel() {
            if (slidesData.length <= 1) return; // Si solo hay 1 imagen, se queda fija

            const showNextSlide = () => {
                const slides = document.querySelectorAll('.slide');
                slides[currentIndex].classList.remove('active');
                
                currentIndex = (currentIndex + 1) % slides.length;
                
                slides[currentIndex].classList.add('active');
                
                // Llama a la siguiente imagen usando el tiempo específico de esa imagen
                setTimeout(showNextSlide, slidesData[currentIndex].duration);
            };

            // Arranca el ciclo con la duración de la primera imagen
            setTimeout(showNextSlide, slidesData[0].duration);
        }

        // Pide los datos a Sheets cada hora por si cambiaste algo, así Yodeck no tiene que reiniciarse
        setInterval(fetchImages, 3600000);

        // Arranca al abrir la página
        fetchImages();
    </script>
</body>
</html>
