<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligencia Comercial - Proyección</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            font-family: 'Rubik', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #carousel-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #ececec;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transform: scale(1);
            transition: opacity 1s ease-in-out, transform 40s linear; 
        }
        .slide.active {
            opacity: 1;
            transform: scale(1.05); /* Zoom sutil adaptado a los 40 segundos */
        }
        .branding {
            position: absolute;
            bottom: 20px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 100;
        }
        .seal {
            font-size: 28px;
            font-weight: 700;
            color: #29903B; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4); 
        }
        .brand {
            font-size: 16px;
            font-weight: 400;
            color: #0669FE; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="carousel-container">
        </div>
    
    <div class="branding">
        <div class="seal">Baalam</div>
        <div class="brand">Inteligencia Comercial</div>
    </div>

    <script>
        // Tu URL de producción de Google Apps Script
        const apiURL = 'https://script.google.com/macros/s/AKfycbwlct8NOwndSkUHFQ7IGxYwiF3D_5PEKfOkj9DuOW1QIUPsSZImo2xkjwuvio4bHbY/exec';
        
        // REGLA FIJA: 40 segundos por diapositiva (40000 milisegundos)
        const SLIDE_DURATION = 40000; 
        
        let slidesData = [];
        let currentIndex = 0;
        let container = document.getElementById('carousel-container');
        let carouselTimeout;

        async function fetchImages() {
            try {
                const response = await fetch(apiURL);
                const newData = await response.json();
                
                // Si hay cambios en los datos o imágenes nuevas, actualiza el carrusel sin parpadear
                if (JSON.stringify(newData) !== JSON.stringify(slidesData)) {
                    slidesData = newData;
                    if(slidesData.length > 0) {
                        renderSlides();
                        // Si el carrusel no ha empezado, lo arranca
                        if (!carouselTimeout && slidesData.length > 1) {
                            startCarousel();
                        }
                    }
                }
            } catch (error) {
                console.error("Error actualizando datos de la pantalla: ", error);
            }
        }

        function renderSlides() {
            // Guarda cuál estaba activa para no romper la transición visual al actualizar datos
            const activeSlideSrc = slidesData[currentIndex] ? slidesData[currentIndex].url : null;
            
            container.innerHTML = '';
            slidesData.forEach((slide, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (slide.url === activeSlideSrc || (index === 0 && !activeSlideSrc) ? ' active' : '');
                div.style.backgroundImage = `url('${slide.url}')`;
                container.appendChild(div);
            });
        }

        function startCarousel() {
            if (slidesData.length <= 1) return;

            const showNextSlide = () => {
                const slides = document.querySelectorAll('.slide');
                if (slides.length === 0) return;

                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
                
                // Agenda la siguiente transición exactamente a los 40 segundos
                carouselTimeout = setTimeout(showNextSlide, SLIDE_DURATION);
            };

            carouselTimeout = setTimeout(showNextSlide, SLIDE_DURATION);
        }

        // DETECCIÓN AUTOMÁTICA: Revisa el Sheet silenciosamente cada 5 minutos (300000 ms)
        setInterval(fetchImages, 300000);

        // Carga inicial al abrir la pantalla
        fetchImages();
    </script>
</body>
</html>
