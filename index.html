<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligencia Comercial - Proyección</title>
    <!-- Importando la fuente Rubik -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            font-family: 'Rubik', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #carousel-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #ececec;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .slide.active {
            opacity: 1;
        }
        .branding {
            position: absolute;
            bottom: 20px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 100;
        }
        .seal {
            font-size: 28px;
            font-weight: 700;
            color: #29903B; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4); 
        }
        .brand {
            font-size: 16px;
            font-weight: 400;
            color: #0669FE; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="carousel-container">
        <!-- JS inyectará las imágenes aquí -->
    </div>
    
    <div class="branding">
        <div class="seal">Baalam</div>
        <div class="brand">Inteligencia Comercial</div>
    </div>

    <script>
        // URL de producción de Google Apps Script ya integrada
        const apiURL = 'https://script.google.com/macros/s/AKfycbwlct8NOwndSkUHFQ7IGxYwiF3D_5PEKfOkj9DuOW1QIUPsSZImo2xkjwuvio4bHbY/exec';
        
        let slidesData = [];
        let currentIndex = 0;
        let container = document.getElementById('carousel-container');

        async function fetchImages() {
            try {
                const response = await fetch(apiURL);
                slidesData = await response.json();
                if(slidesData.length > 0) {
                    renderSlides();
                    startCarousel();
                }
            } catch (error) {
                console.error("Error conectando con Sheets: ", error);
                setTimeout(fetchImages, 15000); 
            }
        }

        function renderSlides() {
            container.innerHTML = '';
            slidesData.forEach((slide, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (index === 0 ? ' active' : '');
                div.style.backgroundImage = `url('${slide.url}')`;
                container.appendChild(div);
            });
        }

        function startCarousel() {
            if (slidesData.length <= 1) return;

            const showNextSlide = () => {
                const slides = document.querySelectorAll('.slide');
                if (slides.length === 0) return;

                slides[currentIndex].classList.remove('active');
                
                currentIndex = (currentIndex + 1) % slides.length;
                
                slides[currentIndex].classList.add('active');
                
                setTimeout(showNextSlide, slidesData[currentIndex].duration);
            };

            setTimeout(showNextSlide, slidesData[0].duration);
        }

        setInterval(fetchImages, 3600000);

        fetchImages();
    </script>
</body>
</html>
